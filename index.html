<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e6f4f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Gezi Rota</title>
  <style>
    :root {
      --bg: linear-gradient(165deg, #e6f4f1 0%, #cce8f4 42%, #e2f3e8 100%);
      --surface: rgba(255, 255, 255, 0.92);
      --surface-solid: #fafffe;
      --accent: #1f8a70;
      --accent-2: #0284c7;
      --accent-light: #5bbfa8;
      --sun: #7ec8a3;
      --text: #134e4a;
      --text-muted: #5a7a72;
      --success: #2d8a5e;
      --delay: #c0564a;
      --border: rgba(31, 138, 112, 0.16);
      --shadow: 0 4px 24px rgba(31, 138, 112, 0.1);
      --radius: 16px;
      --radius-pill: 999px;
      --accent-soft: rgba(31, 138, 112, 0.1);
      --accent-soft-md: rgba(31, 138, 112, 0.18);
      --accent-border: rgba(31, 138, 112, 0.35);
      --accent-glow: rgba(31, 138, 112, 0.32);
      --accent-2-soft: rgba(2, 132, 199, 0.1);
      --accent-2-soft-md: rgba(2, 132, 199, 0.18);
      --accent-2-border: rgba(2, 132, 199, 0.35);
      --accent-2-glow: rgba(2, 132, 199, 0.22);
      --delay-soft: rgba(192, 86, 74, 0.12);
      --delay-border: rgba(192, 86, 74, 0.38);
      --success-soft: rgba(45, 138, 94, 0.14);
      --success-border: rgba(45, 138, 94, 0.28);
      --focus-ring: rgba(2, 132, 199, 0.18);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      overflow-x: clip;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 0.75rem 1rem;
    }

    .tabs-bar {
      align-items: center;
      display: flex;
      gap: 0.5rem;
      margin: 0 auto;
      max-width: 720px;
    }

    .data-actions {
      display: flex;
      flex-shrink: 0;
      gap: 0.25rem;
    }

    .btn-data {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.35rem 0.55rem;
      white-space: nowrap;
    }

    .btn-data:hover {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
    }

    .toast {
      background: var(--text);
      border-radius: var(--radius-pill);
      bottom: calc(3.5rem + env(safe-area-inset-bottom, 0));
      box-shadow: var(--shadow);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      left: 50%;
      max-width: calc(100vw - 2rem);
      opacity: 0;
      padding: 0.55rem 1rem;
      pointer-events: none;
      position: fixed;
      transform: translateX(-50%) translateY(0.5rem);
      transition: opacity 0.25s, transform 0.25s;
      z-index: 200;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .tabs {
      display: flex;
      flex: 1;
      gap: 0.5rem;
      justify-content: center;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .day-tab {
      flex-shrink: 0;
      background: transparent;
      border: 2px solid transparent;
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.5rem 1.1rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .day-tab:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .day-tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .btn-add-day {
      background: var(--accent-soft);
      border: 2px dashed var(--accent-border);
      border-radius: var(--radius-pill);
      color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.45rem 0.85rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-add-day:hover {
      background: var(--accent-soft-md);
      border-color: var(--accent);
    }

    .btn-delete-day {
      background: transparent;
      border: 1px solid var(--delay-border);
      border-radius: var(--radius-pill);
      color: var(--delay);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
    }

    .btn-delete-day:hover { background: var(--delay-soft); }

    .btn-delete-day:disabled {
      cursor: default;
      opacity: 0.35;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0.75rem 0.5rem calc(4rem + env(safe-area-inset-bottom, 0));
    }

    .day-panel { display: none; }
    .day-panel.active { display: block; }

    .day-card {
      background: var(--surface);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .day-header {
      background: linear-gradient(135deg, var(--accent-soft-md), var(--accent-2-soft));
      padding: 0.75rem 1rem 0.65rem;
    }

    .day-title-row {
      align-items: flex-start;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .day-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .day-title-edit {
      align-items: center;
      display: flex;
      flex: 1;
      gap: 0.35rem;
      min-width: 0;
    }

    .day-title-icon {
      flex-shrink: 0;
      font-size: 1.05rem;
      line-height: 1;
    }

    .day-title-input {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--accent-2-border);
      border-radius: 8px;
      color: var(--text);
      flex: 1;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      min-width: 0;
      padding: 0.35rem 0.55rem;
      width: 100%;
    }

    .day-title-input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px var(--focus-ring);
      outline: none;
    }

    .day-title-input::placeholder {
      color: var(--text-muted);
      font-weight: 500;
    }

    .delay-summary {
      background: var(--delay-soft);
      border-radius: var(--radius-pill);
      color: var(--delay);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      white-space: nowrap;
    }

    .delay-summary.on-time {
      background: var(--success-soft);
      color: var(--success);
    }

    .delay-summary.ahead {
      background: var(--success-soft);
      color: var(--success);
    }

    .progress-wrap { margin-top: 0.25rem; }

    .progress-label {
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .progress-bar {
      background: rgba(0, 0, 0, 0.06);
      border-radius: var(--radius-pill);
      height: 6px;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, var(--accent), var(--accent-light), var(--sun));
      border-radius: var(--radius-pill);
      height: 100%;
      transition: width 0.35s ease;
    }

    .sub-bar-wrap {
      display: flex;
      justify-content: center;
      padding: 0.5rem 0.75rem 0;
    }

    .sub-bar {
      background: rgba(0, 0, 0, 0.04);
      border-radius: var(--radius-pill);
      display: inline-flex;
      gap: 0.25rem;
      padding: 0.25rem;
    }

    .sub-tab {
      background: transparent;
      border: none;
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.45rem 1.25rem;
      transition: all 0.2s;
    }

    .sub-tab:hover { color: var(--accent-2); }

    .sub-tab.active {
      background: var(--surface-solid);
      box-shadow: 0 2px 8px var(--accent-2-glow);
      color: var(--accent-2);
    }

    .day-body { padding: 0.5rem 0.75rem 0.75rem; }

    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--delay-border);
      border-radius: var(--radius-pill);
      color: var(--delay);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
    }

    .btn-reset:hover { background: var(--delay-soft); }

    .day-actions {
      align-items: center;
      display: flex;
      gap: 0.5rem;
      justify-content: space-between;
      margin-bottom: 0.35rem;
      padding: 0 0.25rem;
    }

    .mode-toggle {
      background: rgba(0, 0, 0, 0.04);
      border-radius: var(--radius-pill);
      display: inline-flex;
      gap: 0.2rem;
      padding: 0.2rem;
    }

    .mode-btn {
      background: transparent;
      border: none;
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--surface-solid);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
      color: var(--accent);
    }

    .mode-btn.active.edit-active { color: var(--accent-2); }

    .day-actions-right {
      display: flex;
      gap: 0.4rem;
    }

    .btn-add {
      background: var(--accent-2-soft);
      border: 1px solid var(--accent-2-border);
      border-radius: var(--radius-pill);
      color: var(--accent-2);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
    }

    .btn-add:hover { background: var(--accent-2-soft-md); }

    .itinerary-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .itinerary-table {
      border-collapse: collapse;
      table-layout: fixed;
      width: 100%;
    }

    .itinerary-table thead th {
      background: rgba(0, 0, 0, 0.03);
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.45rem 0.4rem;
      text-align: left;
      text-transform: uppercase;
    }

    .itinerary-table tbody tr {
      border-top: 1px solid var(--border);
      height: auto;
      min-height: 42px;
    }

    .itinerary-table tbody tr.next-up {
      background: var(--accent-2-soft);
      box-shadow: inset 3px 0 0 var(--accent-2);
    }

    .itinerary-table tbody tr.done {
      background: var(--success-soft);
    }

    .itinerary-table td {
      font-size: 0.82rem;
      padding: 0.3rem 0.4rem;
      vertical-align: middle;
    }

    .col-check { text-align: center; width: 28px; }
    .col-start { overflow: visible; width: 108px; }
    .col-end { overflow: visible; width: 158px; }
    .col-duration { color: var(--text-muted); font-size: 0.72rem; text-align: right; width: 72px; }
    .col-edit { text-align: center; width: 64px; }
    .col-sort { text-align: center; width: 52px; }

    .col-stop {
      font-size: 0.82rem;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .col-stop a {
      color: var(--accent-2);
      text-decoration: underline;
      text-decoration-style: dotted;
    }

    .task-check {
      accent-color: var(--success);
      cursor: pointer;
      height: 20px;
      width: 20px;
    }

    .task-check:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .itinerary-table tbody tr.locked {
      opacity: 0.72;
    }

    .time-chip,
    .duration-chip,
    .btn-now,
    .btn-icon,
    .mode-btn,
    .sub-tab,
    .day-tab,
    .btn-reset,
    .btn-add,
    .btn-add-day,
    .btn-delete-day,
    .btn-data {
      touch-action: manipulation;
    }

    .time-cell {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem;
      max-width: 100%;
      min-width: 0;
    }

    .time-val {
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .time-val.late { color: var(--delay); }
    .time-val.early { color: var(--success); }

    .delta-inline {
      border-radius: 4px;
      flex-shrink: 0;
      font-size: 0.58rem;
      font-weight: 700;
      line-height: 1;
      padding: 0.1rem 0.25rem;
      white-space: nowrap;
    }

    .delta-inline.late { background: var(--delay-soft); color: var(--delay); }
    .delta-inline.early { background: var(--success-soft); color: var(--success); }

    .next-day-tag {
      color: var(--text-muted);
      font-size: 0.62em;
      font-weight: 700;
      margin-left: 0.1rem;
      vertical-align: super;
    }

    .time-chip {
      background: var(--accent-2-soft);
      border: 1px solid var(--accent-2-border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1;
      padding: 0.2rem 0.35rem;
    }

    .time-chip:hover { background: var(--accent-2-soft-md); }

    .duration-chip {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1;
      padding: 0.2rem 0.45rem;
    }

    .duration-chip:hover { background: var(--accent-soft-md); }

    .time-chip-linked {
      background: rgba(31, 138, 112, 0.06);
      border-color: var(--border);
      color: var(--text-muted);
      cursor: default;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      padding: 0.2rem 0.35rem;
    }

    .time-chip-linked:hover { background: rgba(31, 138, 112, 0.06); }

    .btn-now {
      background: var(--accent-2);
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      font-family: inherit;
      font-size: 0.6rem;
      font-weight: 700;
      line-height: 1;
      padding: 0.22rem 0.3rem;
    }

    .btn-now:hover { opacity: 0.85; }

    .btn-icon {
      align-items: center;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      font-family: inherit;
      font-size: 0.75rem;
      justify-content: center;
      line-height: 1;
      padding: 0.2rem 0.35rem;
      transition: all 0.15s;
    }

    .btn-icon .btn-svg {
      display: block;
      flex-shrink: 0;
      height: 14px;
      width: 14px;
    }

    .btn-icon-edit:hover,
    .btn-icon.btn-icon-edit:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-icon:hover {
      background: var(--accent-2-soft);
      border-color: var(--accent-2);
      color: var(--accent-2);
    }

    .btn-icon:disabled {
      cursor: default;
      opacity: 0.3;
    }

    .row-actions {
      display: flex;
      gap: 2px;
      justify-content: center;
    }

    .btn-icon-delete:hover,
    .btn-icon.btn-icon-delete:hover:not(:disabled) {
      background: var(--delay-soft);
      border-color: var(--delay);
      color: var(--delay);
    }

    .sort-btns {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .sort-btns .btn-icon {
      font-size: 0.6rem;
      padding: 0.1rem 0.3rem;
    }

    .edit-sheet-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem 1.25rem 1.5rem;
    }

    .edit-sheet-form label {
      display: flex;
      flex-direction: column;
      font-size: 0.78rem;
      font-weight: 600;
      gap: 0.3rem;
    }

    .edit-sheet-form input {
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.5rem 0.65rem;
    }

    .edit-sheet-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 0.25rem;
    }

    .btn-save {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.45rem 1rem;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.45rem 1rem;
    }

    .notes-area {
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.6;
      min-height: 220px;
      padding: 1rem;
      resize: vertical;
      width: 100%;
    }

    .notes-area:focus {
      border-color: var(--accent-2);
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .time-picker-overlay {
      inset: 0;
      position: fixed;
      z-index: 100;
    }

    .time-picker-overlay.hidden {
      display: none;
    }

    .time-picker-backdrop {
      background: rgba(19, 78, 74, 0.45);
      inset: 0;
      position: absolute;
    }

    .time-picker-sheet {
      background: var(--surface-solid);
      border-radius: 20px 20px 0 0;
      bottom: 0;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.15);
      left: 0;
      max-height: 70vh;
      position: absolute;
      right: 0;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .time-picker-header {
      align-items: center;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-shrink: 0;
      font-weight: 700;
      justify-content: space-between;
      padding: 1rem 1.25rem 0.75rem;
    }

    .time-picker-close {
      background: rgba(0, 0, 0, 0.05);
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      height: 32px;
      line-height: 1;
      width: 32px;
    }

    .time-picker-grid {
      display: grid;
      gap: 0.5rem;
      grid-template-columns: repeat(4, 1fr);
      overflow-y: auto;
      padding: 1rem 1.25rem 1.5rem;
      -webkit-overflow-scrolling: touch;
    }

    .time-option {
      background: rgba(0, 0, 0, 0.04);
      border: 2px solid transparent;
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      padding: 0.65rem 0.25rem;
      transition: all 0.15s;
    }

    .time-option:hover {
      background: var(--accent-2-soft);
      border-color: var(--accent-2-border);
    }

    .time-option.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    @media (min-width: 600px) {
      .time-picker-sheet {
        border-radius: 16px;
        bottom: auto;
        left: 50%;
        max-width: 360px;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
      }

      .time-picker-grid {
        grid-template-columns: repeat(5, 1fr);
        max-height: 320px;
      }
    }

    @media (max-width: 640px) {

<body>
  <header class="top-bar">
    <div class="tabs-bar" id="tabs-bar">
      <div class="tabs" id="tabs" role="tablist" aria-label="Günler"></div>

      <div class="data-actions">
        <button type="button" class="btn-data" data-action="export-data" aria-label="Veriyi yedekle">Yedekle</button>

  <main id="day-panels"></main>

  <div id="time-picker" class="time-picker-overlay hidden" aria-hidden="true" role="dialog" aria-label="Saat seç">
    <div class="time-picker-backdrop" data-action="close-picker"></div>
    <div class="time-picker-sheet">
      <div class="time-picker-header">
        <span id="time-picker-title">Bitiş saati seç</span>

  <div id="duration-picker" class="time-picker-overlay hidden" aria-hidden="true" role="dialog" aria-label="Süre seç">
    <div class="time-picker-backdrop" data-action="close-duration-picker"></div>

      <div class="time-picker-header">

  <div id="edit-task-sheet" class="time-picker-overlay hidden" aria-hidden="true" role="dialog" aria-label="Durak düzenle">
    <div class="time-picker-backdrop" data-action="close-edit"></div>
    <div class="time-picker-sheet">
      <div class="time-picker-header">
        <span>Durak düzenle</span>

          <input type="url" id="edit-link" placeholder="https://maps.google.com/..." inputmode="url" />
        </label>
        <div class="edit-sheet-actions">
          <button type="button" class="btn-cancel" data-action="close-edit">İptal</button>

  <p class="credit-badge"><strong>Kadirhan Çekmez</strong> tarafından hazırlanmıştır</p>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "geziRota_v2";

    const DEFAULT_DAYS = [
      {
        id: "day1",
        tabLabel: "1. Gün",
        title: "5 Temmuz Pazar – İstanbul ➔ Cunda",
        notes: "",
        items: [
          { time: "05:00", stop: "İstanbul'dan çıkış" },
          { time: "09:30", stop: "Kahvaltı (Ayvalık / Küçükköy civarı)" },
          { time: "10:30", stop: "Küçükköy (taş sokaklar, sanat atölyeleri)" },
          { time: "11:30", stop: "Şeytan Sofrası" },
          { time: "12:15", stop: "🏖️ Sarımsaklı Halk Plajı (ücretsiz giriş, kum plaj, denize girme)" },
          { time: "13:50", stop: "Airbnb'ye hareket" },
          { time: "14:00", stop: "Airbnb Check-in" },
          { time: "15:00", stop: "Rahmi M. Koç Müzesi" },
          { time: "15:50", stop: "Sevim ve Necdet Kent Kitaplığı" },
          { time: "16:20", stop: "Cunda taş sokakları + meşhur börekçi" },
          { time: "17:30", stop: "Cunda sahili ve marina yürüyüşü" },
          { time: "18:00", stop: "Aşıklar Tepesi (gün batımı)" },
          { time: "19:15", stop: "Tekne turu (varsa)" },
          { time: "20:30", stop: "Deniz kenarında akşam yemeği" },
          { time: "22:00", stop: "Cunda merkezde serbest zaman ve Airbnb'ye dönüş", endTime: "22:30" }
        ]
      }
    ];

    let days = JSON.parse(JSON.stringify(DEFAULT_DAYS));
    let state = loadState();
    let notesDebounce = null;
    let titleDebounce = null;
    let pickerTarget = null;
    let durationTarget = null;
    let editTaskTarget = null;
    let eventsBound = false;
    let lastFocusEl = null;
    let toastTimer = null;

    const HALF_HOUR_OPTIONS = (() => {
      const opts = [];
      for (let h = 0; h < 24; h++) {
        opts.push(minutesToTime(h * 60));
        opts.push(minutesToTime(h * 60 + 30));
      }
      return opts;
    })();

    const DURATION_OPTIONS = [15, 30, 45, 60, 90, 120, 150, 180, 240, 300, 360];

    function snapToHalfHour(time) {
      if (!time) return "00:00";
      const mins = timeToMinutes(time);
      return minutesToTime(Math.round(mins / 30) * 30);
    }

    function snapMinutesToHalfHour(mins) {
      return Math.round(mins / 30) * 30;
    }

    /** Saat string → dakika; gece yarısı geçişinde referans başlangıçtan sonraki güne taşır */
    function clockToAbsoluteMinutes(clockTime, referenceStartMin) {
      const m = timeToMinutes(snapToHalfHour(clockTime));
      if (m < referenceStartMin && referenceStartMin - m > 720) {
        return m + 1440;
      }
      return m;
    }

    function timeToMinutes(time) {
      const [h, m] = time.split(":").map(Number);
      return h * 60 + m;
    }

    function minutesToTime(mins) {
      const wrapped = ((mins % 1440) + 1440) % 1440;
      const h = Math.floor(wrapped / 60);
      const m = wrapped % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function formatDurationMinutes(mins) {
      if (mins <= 0) return "—";
      if (mins % 60 === 0) {
        const h = mins / 60;
        return h === 1 ? "1 saat" : `${h} saat`;
      }
      if (mins % 60 === 30) {
        const h = Math.floor(mins / 60);
        return h ? `${h},5 saat` : "30 dk";
      }
      if (mins < 60) return `${mins} dk`;
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${h} saat ${m} dk`;
    }

    function formatDelta(mins) {
      if (mins === 0) return { text: "", type: "" };
      const abs = Math.abs(mins);
      const sign = mins > 0 ? "+" : "-";

      if (abs % 60 === 0) {
        const h = abs / 60;
        return { text: `${sign}${h} saat`, type: mins > 0 ? "late" : "early" };
      }
      if (abs % 30 === 0 && abs >= 30) {
        const h = Math.floor(abs / 60);
        const half = abs % 60 === 30;
        const text = h && half ? `${sign}${h},5 saat` : half ? `${sign}30 dk` : `${sign}${h} saat`;
        return { text, type: mins > 0 ? "late" : "early" };
      }
      if (abs < 60) {
        return { text: `${sign}${abs} dk`, type: mins > 0 ? "late" : "early" };
      }
      const h = Math.floor(abs / 60);
      const m = abs % 60;
      return { text: m ? `${sign}${h}s ${m}dk` : `${sign}${h} saat`, type: mins > 0 ? "late" : "early" };
    }

    function formatDelaySummary(mins) {
      if (mins === 0) return "Zamanında";
      return formatDelta(mins).text;
    }

    function isItemDone(itemState) {
      return Boolean(itemState?.done && itemState?.actualEnd);
    }

    function showToast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("visible"), 2800);
    }

    function validateSlotTimes(startTime, endTime) {
      return timeToMinutes(endTime) >= timeToMinutes(startTime);
    }

    function shiftPlannedTimesFrom(dayItems, fromIndex, deltaMin) {
      for (let j = fromIndex; j < dayItems.length; j++) {
        const m = timeToMinutes(dayItems[j].time) + deltaMin;
        dayItems[j].time = snapToHalfHour(minutesToTime(m));
      }
    }

    /** items[boundaryIndex].time = row boundary; altındaki tüm saatler delta kadar kayar */
    function applyBoundaryTime(dayItems, boundaryIndex, newTime) {
      const t = snapToHalfHour(newTime);
      const delta = timeToMinutes(t) - timeToMinutes(dayItems[boundaryIndex].time);
      if (delta === 0) return true;

      if (boundaryIndex > 0 && timeToMinutes(t) < timeToMinutes(dayItems[boundaryIndex - 1].time)) {
        showToast("Saat, bir önceki durağın başlangıcından önce olamaz");
        return false;
      }
      if (boundaryIndex < dayItems.length - 1) {
        const newNextMin = timeToMinutes(dayItems[boundaryIndex + 1].time) + delta;
        if (timeToMinutes(t) > newNextMin) {
          showToast("Saat, bir sonraki sınırdan sonra olamaz");
          return false;
        }
      }

      shiftPlannedTimesFrom(dayItems, boundaryIndex, delta);
      return true;
    }

    /** Seçilen süre → satır bitişi; alt satırlar kendi süreleriyle zincirleme kayar */
    function applyRowDuration(dayItems, index, durationMin) {
      if (durationMin <= 0) {
        showToast("Geçersiz süre");
        return false;
      }
      if (index < 0 || index >= dayItems.length) return false;

      const { starts, ends } = buildPlannedChain(dayItems);
      const durations = starts.map((s, i) => timeToMinutes(ends[i]) - timeToMinutes(s));
      durations[index] = durationMin;

      let startMin = timeToMinutes(dayItems[index].time);

      for (let j = index; j < dayItems.length; j++) {
        const endMin = snapMinutesToHalfHour(startMin + durations[j]);
        if (endMin < startMin) {
          showToast("Bitiş, başlangıç saatinden önce olamaz");
          return false;
        }

        if (j === dayItems.length - 1) {
          dayItems[j].endTime = minutesToTime(endMin);
        } else {
          dayItems[j + 1].time = minutesToTime(endMin);
          startMin = endMin;
        }
      }
      return true;
    }

    /** Son durak bitişi — yalnızca o durağın süresini değiştirir */
    function applyLastStopEnd(dayItems, newTime) {
      const last = dayItems.length - 1;
      if (last < 0) return false;
      const t = snapToHalfHour(newTime);
      if (!validateSlotTimes(dayItems[last].time, t)) {
        showToast("Bitiş, başlangıç saatinden önce olamaz");
        return false;
      }
      dayItems[last].endTime = t;
      return true;
    }

    function getPlannedEnd(dayItems, index) {
      if (index < dayItems.length - 1) {
        return dayItems[index + 1].time;
      }
      const item = dayItems[index];
      return item.endTime || item.time;
    }

    function getDefaultDayState(day) {
      return {
        activeView: "program",
        mode: "usage",
        notes: day.notes || "",
        items: {}
      };
    }

    function loadState() {
      const defaults = {
        activeDayId: days[0]?.id || null,
        days: {}
      };
      days.forEach((day) => {
        defaults.days[day.id] = getDefaultDayState(day);
      });

      try {
        let saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) {
          const v1 = JSON.parse(localStorage.getItem("geziRota_v1"));
          if (v1) saved = { ...v1, daysData: null };
        }
        if (!saved) return defaults;

        if (saved.daysData && Array.isArray(saved.daysData)) {
          days = saved.daysData;
        }

        if (saved.activeDayId && days.some((d) => d.id === saved.activeDayId)) {
          defaults.activeDayId = saved.activeDayId;
        }

        days.forEach((day) => {
          const savedDay = saved.days?.[day.id];
          if (!savedDay) return;
          defaults.days[day.id] = {
            activeView: savedDay.activeView === "notes" ? "notes" : "program",
            mode: savedDay.mode === "edit" ? "edit" : "usage",
            notes: typeof savedDay.notes === "string" ? savedDay.notes : day.notes || "",
            items: savedDay.items && typeof savedDay.items === "object" ? savedDay.items : {}
          };
          Object.values(defaults.days[day.id].items).forEach((item) => {
            if (item?.actualEnd) item.actualEnd = snapToHalfHour(item.actualEnd);
          });
          Object.keys(defaults.days[day.id].items).forEach((key) => {
            if (!isItemDone(defaults.days[day.id].items[key])) {
              delete defaults.days[day.id].items[key];
            }
          });
          sanitizeCompletionOrder(defaults.days[day.id], day.items.length);
        });
      } catch (_) {
        /* ignore corrupt storage */
      }

      return defaults;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, daysData: days }));
    }

    function ensureDayState(dayId) {
      if (!state.days[dayId]) {
        const day = days.find((d) => d.id === dayId);
        state.days[dayId] = getDefaultDayState(day || { notes: "" });
      }
      return state.days[dayId];
    }

    function hasCompletedTasks(dayState) {
      return Object.values(dayState.items).some((item) => item?.done && item?.actualEnd);
    }

    function buildPlannedChain(dayItems) {
      const n = dayItems.length;
      if (n === 0) return { starts: [], ends: [] };

      const starts = [];
      const ends = [];

      starts[0] = snapToHalfHour(dayItems[0].time);
      for (let i = 0; i < n - 1; i++) {
        ends[i] = snapToHalfHour(dayItems[i + 1].time);
        starts[i + 1] = ends[i];
      }
      if (n > 0) {
        starts[n - 1] = snapToHalfHour(dayItems[n - 1].time);
        ends[n - 1] = snapToHalfHour(getPlannedEnd(dayItems, n - 1));
      }

      return { starts, ends };
    }

    function buildPlannedSchedule(dayItems) {
      const { starts, ends } = buildPlannedChain(dayItems);
      return dayItems.map((item, i) => ({
        index: i,
        plannedStart: starts[i],
        plannedEnd: ends[i],
        adjustedStart: starts[i],
        adjustedEnd: ends[i],
        adjustedStartMin: timeToMinutes(starts[i]),
        adjustedEndMin: timeToMinutes(ends[i]),
        actualEnd: null,
        slotDuration: timeToMinutes(ends[i]) - timeToMinutes(starts[i]),
        isDone: false,
        startDeltaMin: 0,
        endDeltaMin: 0
      }));
    }

    function computeSchedule(dayItems, dayState) {
      const planned = buildPlannedSchedule(dayItems);
      if (!hasCompletedTasks(dayState)) return planned;

      const schedule = [];

      for (let i = 0; i < dayItems.length; i++) {
        const itemState = dayState.items[String(i)];
        const isDone = Boolean(itemState?.done && itemState?.actualEnd);
        const plannedStartMin = timeToMinutes(planned[i].plannedStart);
        const plannedEndMin = timeToMinutes(planned[i].plannedEnd);
        const slotLen = plannedEndMin - plannedStartMin;

        const adjustedStartMin = i === 0
          ? plannedStartMin
          : schedule[i - 1].adjustedEndMin;

        let adjustedEndMin;
        if (isDone) {
          adjustedEndMin = Math.max(
            adjustedStartMin,
            clockToAbsoluteMinutes(itemState.actualEnd, adjustedStartMin)
          );
        } else {
          adjustedEndMin = snapMinutesToHalfHour(adjustedStartMin + slotLen);
        }

        schedule.push({
          index: i,
          plannedStart: planned[i].plannedStart,
          plannedEnd: planned[i].plannedEnd,
          adjustedStart: minutesToTime(adjustedStartMin),
          adjustedEnd: minutesToTime(adjustedEndMin),
          adjustedStartMin,
          adjustedEndMin,
          actualEnd: isDone ? minutesToTime(adjustedEndMin) : null,
          slotDuration: slotLen,
          isDone,
          startDeltaMin: adjustedStartMin - plannedStartMin,
          endDeltaMin: adjustedEndMin - plannedEndMin
        });
      }

      return schedule;
    }

    function getDayProgress(day, dayState) {
      const total = day.items.length;
      const done = Object.values(dayState.items).filter(isItemDone).length;
      return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
    }

    function getDayDelay(schedule) {
      const nextIdx = schedule.findIndex((s) => !s.isDone);
      if (nextIdx === -1) {
        const last = schedule[schedule.length - 1];
        return last ? last.endDeltaMin : 0;
      }
      return schedule[nextIdx].startDeltaMin;
    }

    function getNextUpIndex(dayState, itemCount) {
      for (let i = 0; i < itemCount; i++) {
        if (!isItemDone(dayState.items[String(i)])) return i;
      }
      return -1;
    }

    function getLastDoneIndex(dayState, itemCount) {
      const nextUp = getNextUpIndex(dayState, itemCount);
      return nextUp <= 0 ? (nextUp === 0 ? -1 : itemCount - 1) : nextUp - 1;
    }

    function canToggleCheck(dayState, itemCount, index, checked) {
      const nextUp = getNextUpIndex(dayState, itemCount);
      if (checked) return index === nextUp;
      return index === getLastDoneIndex(dayState, itemCount);
    }

    function sanitizeCompletionOrder(dayState, itemCount) {
      for (let i = 0; i < itemCount; i++) {
        if (!isItemDone(dayState.items[String(i)])) {
          for (let j = i + 1; j < itemCount; j++) delete dayState.items[String(j)];
          break;
        }
      }
    }

    function nowTimeString() {
      const d = new Date();
      return snapToHalfHour(`${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`);
    }

    function iconEdit() {
      return `<svg class="btn-svg" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M11.5 1.5l3 3-9 9H2v-3.5l9-9z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
        <path d="M10 3l3 3" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
      </svg>`;
    }

    function iconDelete() {
      return `<svg class="btn-svg" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 4.5h10" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
        <path d="M6 4.5V3.75a.75.75 0 01.75-.75h2.5a.75.75 0 01.75.75V4.5" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
        <path d="M5.25 4.5l.55 7.65a.75.75 0 00.74.7h3.92a.75.75 0 00.74-.7L11.75 4.5" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
        <path d="M6.75 7.25v3.5M9.25 7.25v3.5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      </svg>`;
    }

    function renderStop(item) {
      const label = escapeHtml(item.stop);
      if (item.link) {
        return `<a href="${escapeAttr(item.link)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      }
      return label;
    }

    function defaultActualEnd(day, index, schedule) {
      return schedule[index].adjustedEnd;
    }

    function formatClockLabel(absoluteMin) {
      const clock = minutesToTime(absoluteMin);
      if (absoluteMin >= 1440) {
        return `${clock}<span class="next-day-tag" title="Ertesi gün">⁺¹</span>`;
      }
      return clock;
    }

    function renderCompactTime(planned, adjusted, deltaMin, absoluteMin) {
      const display = formatClockLabel(absoluteMin ?? timeToMinutes(adjusted));
      const tone = deltaMin > 0 ? "late" : deltaMin < 0 ? "early" : "";
      const delta = formatDelta(deltaMin);
      if (deltaMin === 0) {
        return `<span class="time-val">${display}</span>`;
      }
      return `
        <span class="time-val${tone ? ` ${tone}` : ""}" title="Plan: ${planned}">${display}</span>
        <span class="delta-inline ${delta.type}">${delta.text}</span>
      `;
    }

    function renderTableHead(mode) {
      if (mode === "edit") {
        return `
          <tr>
            <th class="col-start">Başlangıç</th>
            <th class="col-end">Bitiş</th>
            <th>Durak</th>
            <th class="col-edit"></th>
            <th class="col-duration">Süre</th>
            <th class="col-sort"></th>
          </tr>
        `;
      }
      return `
        <tr>
          <th class="col-check"></th>
          <th class="col-start">Başlangıç</th>
          <th class="col-end">Bitiş</th>
          <th>Durak</th>
          <th class="col-duration">Süre</th>
        </tr>
      `;
    }

    function renderTaskRow(day, dayState, schedule, index, mode) {
      const item = day.items[index];
      const slot = schedule[index];
      const itemCount = day.items.length;
      const isLast = index === itemCount - 1;

      if (mode === "edit") {
        const startTime = slot.plannedStart;
        const endTime = slot.plannedEnd;
        const startCell = index === 0
          ? `<button type="button" class="time-chip" data-action="open-picker"
              data-day-id="${day.id}" data-index="${index}" data-field="plannedStart"
              data-current="${startTime}">${startTime}</button>`
          : `<span class="time-chip-linked" title="Önceki durağın bitiş saati">${startTime}</span>`;
        const endCell = `<button type="button" class="time-chip" data-action="open-picker"
            data-day-id="${day.id}" data-index="${index}" data-field="plannedEnd"
            data-current="${endTime}">${endTime}</button>`;
        return `
          <tr class="task-row" data-index="${index}">
            <td class="col-start" data-label="Başlangıç">
              <div class="time-cell">${startCell}</div>
            </td>
            <td class="col-end" data-label="Bitiş"><div class="time-cell">${endCell}</div></td>
            <td class="col-stop" title="${escapeHtml(item.stop)}">${renderStop(item)}</td>
            <td class="col-edit">
              <div class="row-actions">
                <button type="button" class="btn-icon btn-icon-edit" data-action="edit-task"
                  data-day-id="${day.id}" data-index="${index}" aria-label="Düzenle">${iconEdit()}</button>
                <button type="button" class="btn-icon btn-icon-delete" data-action="delete-task"
                  data-day-id="${day.id}" data-index="${index}"
                  ${itemCount <= 1 ? "disabled" : ""} aria-label="Sil">${iconDelete()}</button>
              </div>
            </td>
            <td class="col-duration" data-label="Süre">
              <button type="button" class="duration-chip" data-action="open-duration-picker"
                data-day-id="${day.id}" data-index="${index}" data-current="${slot.slotDuration}"
                aria-label="Süre seç">${formatDurationMinutes(slot.slotDuration)}</button>
            </td>
            <td class="col-sort">
              <div class="sort-btns">
                <button type="button" class="btn-icon" data-action="move-up"
                  data-day-id="${day.id}" data-index="${index}" ${index === 0 ? "disabled" : ""} aria-label="Yukarı">▲</button>
                <button type="button" class="btn-icon" data-action="move-down"
                  data-day-id="${day.id}" data-index="${index}" ${isLast ? "disabled" : ""} aria-label="Aşağı">▼</button>
              </div>
            </td>
          </tr>
        `;
      }

      const itemState = dayState.items[String(index)] || {};
      const isDone = isItemDone(itemState);
      const nextUp = getNextUpIndex(dayState, itemCount);
      const isNext = nextUp === index;
      const canCheck = canToggleCheck(dayState, itemCount, index, !isDone);
      const isLocked = !isDone && index > nextUp;
      const checkDisabled = isDone
        ? !canToggleCheck(dayState, itemCount, index, false)
        : !canCheck;
      const checkLabel = checkDisabled && !isDone
        ? `${item.stop} — önce sıradaki durak tamamlanmalı`
        : `${item.stop} tamamlandı`;
      const displayEnd = isDone
        ? snapToHalfHour(itemState.actualEnd || slot.adjustedEnd)
        : slot.adjustedEnd;
      const endDelta = slot.endDeltaMin;

      const endCell = isDone
        ? `<div class="time-cell">
            <button type="button" class="time-chip" aria-label="Bitiş saati seç"
              data-action="open-picker" data-day-id="${day.id}" data-index="${index}"
              data-field="actualEnd" data-current="${displayEnd}">${formatClockLabel(slot.adjustedEndMin)}</button>
            <button type="button" class="btn-now" data-action="now" data-day-id="${day.id}" data-index="${index}">Şimdi</button>
            ${endDelta !== 0 ? `<span class="delta-inline ${endDelta > 0 ? "late" : "early"}">${formatDelta(endDelta).text}</span>` : ""}
          </div>`
        : `<div class="time-cell">${renderCompactTime(slot.plannedEnd, displayEnd, endDelta, slot.adjustedEndMin)}</div>`;

      return `
        <tr class="task-row${isDone ? " done" : ""}${isNext ? " next-up" : ""}${isLocked ? " locked" : ""}" data-index="${index}">
          <td class="col-check">
            <input type="checkbox" class="task-check" aria-label="${checkLabel}"
              ${isDone ? "checked" : ""} ${checkDisabled ? "disabled" : ""} data-action="toggle"
              data-day-id="${day.id}" data-index="${index}" />
          </td>
          <td class="col-start" data-label="Başlangıç">
            <div class="time-cell">${renderCompactTime(slot.plannedStart, slot.adjustedStart, slot.startDeltaMin, slot.adjustedStartMin)}</div>
          </td>
          <td class="col-end" data-label="Bitiş">${endCell}</td>
          <td class="col-stop" title="${escapeHtml(item.stop)}">${renderStop(item)}</td>
          <td class="col-duration" data-label="Süre">${formatDurationMinutes(slot.slotDuration)}</td>
        </tr>
      `;
    }

    function renderDayPanel(day) {
      const dayState = ensureDayState(day.id);
      const mode = dayState.mode || "usage";
      const schedule = computeSchedule(day.items, dayState);
      const progress = getDayProgress(day, dayState);
      const delayMin = getDayDelay(schedule);
      const delayLabel = formatDelaySummary(delayMin);
      const delayClass = delayMin > 0 ? "" : delayMin < 0 ? " ahead" : " on-time";
      const isActive = state.activeDayId === day.id;
      const isEdit = mode === "edit";

      return `
        <section
          class="day-panel${isActive ? " active" : ""}"
          id="panel-${day.id}"
          role="tabpanel"
          aria-labelledby="tab-${day.id}"
          ${isActive ? "" : "hidden"}
        >
          <div class="day-card">
            <div class="day-header">
              <div class="day-title-row">
                ${isEdit
                  ? `<label class="day-title-edit">
                      <span class="day-title-icon" aria-hidden="true">📅</span>
                      <input type="text" class="day-title-input" value="${escapeAttr(day.title)}"
                        placeholder="Gün başlığı" data-action="day-title" data-day-id="${day.id}"
                        aria-label="Gün başlığı" />
                    </label>`
                  : `<h2 class="day-title">📅 ${day.title}</h2>`}
                ${isEdit ? "" : `<span class="delay-summary${delayClass}">${delayLabel}</span>`}
              </div>
              ${isEdit ? "" : `
              <div class="progress-wrap">
                <div class="progress-label">${progress.done} / ${progress.total} tamamlandı</div>
                <div class="progress-bar" role="progressbar" aria-valuenow="${progress.pct}" aria-valuemin="0" aria-valuemax="100">
                  <div class="progress-fill" style="width:${progress.pct}%"></div>
                </div>
              </div>`}
            </div>

            <div class="sub-bar-wrap">
              <div class="sub-bar" role="tablist" aria-label="${day.tabLabel} görünümü">
                <button type="button" class="sub-tab${dayState.activeView === "program" ? " active" : ""}"
                  role="tab" aria-selected="${dayState.activeView === "program"}"
                  data-action="view" data-day-id="${day.id}" data-view="program">Program</button>
                <button type="button" class="sub-tab${dayState.activeView === "notes" ? " active" : ""}"
                  role="tab" aria-selected="${dayState.activeView === "notes"}"
                  data-action="view" data-day-id="${day.id}" data-view="notes">Notlar</button>
              </div>
            </div>

            <div class="day-body">
              <div class="view-panel${dayState.activeView === "program" ? " active" : ""}" data-view-panel="program">
                <div class="day-actions">
                  <div class="mode-toggle">
                    <button type="button" class="mode-btn${!isEdit ? " active" : ""}"
                      data-action="set-mode" data-day-id="${day.id}" data-mode="usage">Kullanım</button>
                    <button type="button" class="mode-btn${isEdit ? " active edit-active" : ""}"
                      data-action="set-mode" data-day-id="${day.id}" data-mode="edit">Düzenleme</button>
                  </div>
                  <div class="day-actions-right">
                    ${isEdit
                      ? `<button type="button" class="btn-add" data-action="add-task" data-day-id="${day.id}">+ Yeni durak</button>
                         <button type="button" class="btn-delete-day" data-action="delete-day" data-day-id="${day.id}"
                           ${days.length <= 1 ? "disabled" : ""}>Günü sil</button>`
                      : `<button type="button" class="btn-reset" data-action="reset" data-day-id="${day.id}">Günü sıfırla</button>`}
                  </div>
                </div>
                <div class="itinerary-wrap">
                  <table class="itinerary-table mode-${mode}">
                    <thead>${renderTableHead(mode)}</thead>
                    <tbody>
                      ${day.items.map((_, i) => renderTaskRow(day, dayState, schedule, i, mode)).join("")}
                    </tbody>
                  </table>
                </div>
              </div>
              <div class="view-panel${dayState.activeView === "notes" ? " active" : ""}" data-view-panel="notes">
                <textarea class="notes-area"
                  placeholder="Bu gün için notlar, adresler, rezervasyon bilgileri..."
                  data-action="notes" data-day-id="${day.id}"
                >${escapeHtml(dayState.notes)}</textarea>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, "&quot;");
    }

    function renderTab(day, index) {
      const isActive = state.activeDayId === day.id;
      return `
        <button
          type="button"
          class="day-tab${isActive ? " active" : ""}"
          id="tab-${day.id}"
          role="tab"
          aria-controls="panel-${day.id}"
          aria-selected="${isActive}"
          data-day-id="${day.id}"
          tabindex="${isActive ? "0" : "-1"}"
        >${day.tabLabel}</button>
      `;
    }

    function renderApp() {
      document.getElementById("tabs").innerHTML = days.map(renderTab).join("");
      document.getElementById("day-panels").innerHTML = days.map(renderDayPanel).join("");
      bindEvents();
    }

    function initTimePicker() {
      const grid = document.getElementById("time-picker-grid");
      if (grid.childElementCount > 0) return;
      grid.innerHTML = HALF_HOUR_OPTIONS.map((time) => `
        <button type="button" class="time-option" data-action="pick-time" data-time="${time}">${time}</button>
      `).join("");

      document.getElementById("time-picker").addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el) return;
        if (el.dataset.action === "close-picker") closeTimePicker();
        if (el.dataset.action === "pick-time" && pickerTarget) {
          applyPickedTime(pickerTarget.dayId, pickerTarget.index, pickerTarget.field, el.dataset.time);
          closeTimePicker();
        }
      });

      const durationGrid = document.getElementById("duration-picker-grid");
      durationGrid.innerHTML = DURATION_OPTIONS.map((mins) => `
        <button type="button" class="time-option" data-action="pick-duration" data-mins="${mins}">${formatDurationMinutes(mins)}</button>
      `).join("");

      document.getElementById("duration-picker").addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el) return;
        if (el.dataset.action === "close-duration-picker") closeDurationPicker();
        if (el.dataset.action === "pick-duration" && durationTarget) {
          applyPickedDuration(durationTarget.dayId, durationTarget.index, Number(el.dataset.mins));
          closeDurationPicker();
        }
      });

      document.getElementById("edit-task-sheet").addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el) return;
        if (el.dataset.action === "close-edit") closeEditTask();
      });

      document.getElementById("edit-task-form").addEventListener("submit", (e) => {
        e.preventDefault();
        saveEditTask();
      });
    }

    const PICKER_TITLES = {
      actualEnd: "Bitiş saati seç",
      plannedStart: "Başlangıç saati seç",
      plannedEnd: "Bitiş saati seç"
    };

    function openTimePicker(dayId, index, currentValue, field) {
      pickerTarget = { dayId, index, field: field || "actualEnd" };
      document.getElementById("time-picker-title").textContent =
        PICKER_TITLES[pickerTarget.field] || "Saat seç";
      const overlay = document.getElementById("time-picker");
      const snapped = snapToHalfHour(currentValue);
      overlay.querySelectorAll(".time-option").forEach((btn) => {
        btn.classList.toggle("selected", btn.dataset.time === snapped);
      });
      const selected = overlay.querySelector(".time-option.selected");
      if (selected) {
        setTimeout(() => selected.scrollIntoView({ block: "center", behavior: "smooth" }), 50);
      }
      lastFocusEl = document.activeElement;
      overlay.classList.remove("hidden");
      overlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      setTimeout(() => overlay.querySelector(".time-picker-close")?.focus(), 0);
    }

    function closeTimePicker() {
      pickerTarget = null;
      const overlay = document.getElementById("time-picker");
      overlay.classList.add("hidden");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      restoreFocus();
    }

    function openDurationPicker(dayId, index, currentMins) {
      durationTarget = { dayId, index };
      const overlay = document.getElementById("duration-picker");
      const current = Number(currentMins) || 0;
      overlay.querySelectorAll(".time-option").forEach((btn) => {
        btn.classList.toggle("selected", Number(btn.dataset.mins) === current);
      });
      const selected = overlay.querySelector(".time-option.selected");
      if (selected) {
        setTimeout(() => selected.scrollIntoView({ block: "center", behavior: "smooth" }), 50);
      }
      lastFocusEl = document.activeElement;
      overlay.classList.remove("hidden");
      overlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      setTimeout(() => overlay.querySelector(".time-picker-close")?.focus(), 0);
    }

    function closeDurationPicker() {
      durationTarget = null;
      const overlay = document.getElementById("duration-picker");
      overlay.classList.add("hidden");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      restoreFocus();
    }

    function applyPickedDuration(dayId, index, durationMin) {
      if (!durationMin || durationMin <= 0) return;
      const day = days.find((d) => d.id === dayId);
      if (!day) return;
      if (!applyRowDuration(day.items, index, durationMin)) return;
      saveState();
      renderApp();
    }

    function restoreFocus() {
      if (lastFocusEl?.focus) {
        lastFocusEl.focus();
        lastFocusEl = null;
      }
    }

    function applyPickedTime(dayId, index, field, time) {
      if (!time) return;
      const t = snapToHalfHour(time);
      const day = days.find((d) => d.id === dayId);
      if (!day) return;

      if (field === "plannedStart") {
        if (index !== 0) return;
        if (!applyBoundaryTime(day.items, 0, t)) return;
        saveState();
        renderApp();
      } else if (field === "plannedEnd") {
        const isLast = index >= day.items.length - 1;
        const ok = isLast
          ? applyLastStopEnd(day.items, t)
          : applyBoundaryTime(day.items, index + 1, t);
        if (!ok) return;
        saveState();
        renderApp();
      } else {
        setActualEnd(dayId, index, t);
      }
    }

    function openEditTask(dayId, index) {
      const day = days.find((d) => d.id === dayId);
      const item = day.items[index];
      editTaskTarget = { dayId, index };
      document.getElementById("edit-stop").value = item.stop;
      document.getElementById("edit-link").value = item.link || "";
      const sheet = document.getElementById("edit-task-sheet");
      lastFocusEl = document.activeElement;
      sheet.classList.remove("hidden");
      sheet.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      setTimeout(() => document.getElementById("edit-stop")?.focus(), 0);
    }

    function closeEditTask() {
      editTaskTarget = null;
      const sheet = document.getElementById("edit-task-sheet");
      sheet.classList.add("hidden");
      sheet.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      restoreFocus();
    }

    function saveEditTask() {
      if (!editTaskTarget) return;
      const { dayId, index } = editTaskTarget;
      const day = days.find((d) => d.id === dayId);
      day.items[index].stop = document.getElementById("edit-stop").value.trim();
      const link = document.getElementById("edit-link").value.trim();
      if (link) day.items[index].link = link;
      else delete day.items[index].link;
      closeEditTask();
      saveState();
      renderApp();
    }

    function reindexCompletionAfterDelete(dayState, deletedIndex) {
      const newItems = {};
      Object.keys(dayState.items).forEach((key) => {
        const oldIdx = Number(key);
        if (oldIdx === deletedIndex) return;
        const newIdx = oldIdx > deletedIndex ? oldIdx - 1 : oldIdx;
        newItems[String(newIdx)] = dayState.items[key];
      });
      dayState.items = newItems;
    }

    function deleteTask(dayId, index) {
      const day = days.find((d) => d.id === dayId);
      if (!day || day.items.length <= 1) return;
      const dayState = ensureDayState(dayId);
      day.items.splice(index, 1);
      reindexCompletionAfterDelete(dayState, index);
      if (editTaskTarget?.dayId === dayId) {
        if (editTaskTarget.index === index) closeEditTask();
        else if (editTaskTarget.index > index) editTaskTarget.index--;
      }
      saveState();
      renderApp();
    }

    function reindexCompletion(dayState, fromIndex, toIndex) {
      const oldItems = dayState.items;
      const newItems = {};
      Object.keys(oldItems).forEach((key) => {
        let oldIdx = Number(key);
        let newIdx = oldIdx;
        if (oldIdx === fromIndex) newIdx = toIndex;
        else if (oldIdx === toIndex) newIdx = fromIndex;
        newItems[String(newIdx)] = oldItems[key];
      });
      dayState.items = newItems;
    }

    function moveTask(dayId, index, direction) {
      const day = days.find((d) => d.id === dayId);
      const newIdx = index + direction;
      if (newIdx < 0 || newIdx >= day.items.length) return;
      const dayState = ensureDayState(dayId);
      [day.items[index], day.items[newIdx]] = [day.items[newIdx], day.items[index]];
      reindexCompletion(dayState, index, newIdx);
      saveState();
      renderApp();
    }

    function addTask(dayId) {
      const day = days.find((d) => d.id === dayId);
      if (day.items.length > 0) delete day.items[day.items.length - 1].endTime;
      const lastEnd = getPlannedEnd(day.items, day.items.length - 1);
      const newTime = snapToHalfHour(minutesToTime(timeToMinutes(lastEnd) + 30));
      const newEnd = snapToHalfHour(minutesToTime(timeToMinutes(newTime) + 30));
      day.items.push({ time: newTime, stop: "Yeni durak", endTime: newEnd });
      saveState();
      renderApp();
    }

    function setMode(dayId, mode) {
      ensureDayState(dayId).mode = mode;
      saveState();
      renderApp();
    }

    function generateDayId() {
      let n = 1;
      while (days.some((d) => d.id === `day${n}`)) n++;
      return `day${n}`;
    }

    function renumberDayTabLabels() {
      days.forEach((day, i) => {
        day.tabLabel = `${i + 1}. Gün`;
      });
    }

    function addDay() {
      const num = days.length + 1;
      const id = generateDayId();
      const newDay = {
        id,
        tabLabel: `${num}. Gün`,
        title: `${num}. Gün`,
        notes: "",
        items: [{ time: "09:00", stop: "Yeni durak" }]
      };
      days.push(newDay);
      state.days[id] = { ...getDefaultDayState(newDay), mode: "edit" };
      state.activeDayId = id;
      saveState();
      renderApp();
    }

    function deleteDay(dayId) {
      if (days.length <= 1) return;
      const idx = days.findIndex((d) => d.id === dayId);
      if (idx === -1) return;

      days.splice(idx, 1);
      delete state.days[dayId];

      if (editTaskTarget?.dayId === dayId) closeEditTask();
      if (pickerTarget?.dayId === dayId) closeTimePicker();
      if (durationTarget?.dayId === dayId) closeDurationPicker();

      if (state.activeDayId === dayId) {
        const nextIdx = Math.min(idx, days.length - 1);
        state.activeDayId = days[nextIdx].id;
      }

      renumberDayTabLabels();
      saveState();
      renderApp();
    }

    function exportData() {
      saveState();
      const payload = JSON.stringify({ ...state, daysData: days }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `gezi-rota-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Yedek indirildi");
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const saved = JSON.parse(reader.result);
          if (!saved || typeof saved !== "object") throw new Error("invalid");
          if (!saved.daysData || !Array.isArray(saved.daysData) || saved.daysData.length === 0) {
            showToast("Geçersiz yedek dosyası");
            return;
          }
          days = saved.daysData;
          state = {
            activeDayId: saved.activeDayId && days.some((d) => d.id === saved.activeDayId)
              ? saved.activeDayId
              : days[0].id,
            days: {}
          };
          days.forEach((day) => {
            const savedDay = saved.days?.[day.id];
            state.days[day.id] = savedDay
              ? {
                  activeView: savedDay.activeView === "notes" ? "notes" : "program",
                  mode: savedDay.mode === "edit" ? "edit" : "usage",
                  notes: typeof savedDay.notes === "string" ? savedDay.notes : day.notes || "",
                  items: savedDay.items && typeof savedDay.items === "object" ? savedDay.items : {}
                }
              : getDefaultDayState(day);
            sanitizeCompletionOrder(state.days[day.id], day.items.length);
          });
          closeEditTask();
          closeTimePicker();
          closeDurationPicker();
          saveState();
          renderApp();
          showToast("Yedek geri yüklendi");
        } catch (_) {
          showToast("Dosya okunamadı");
        }
      };
      reader.readAsText(file);
    }

    function bindEvents() {
      if (eventsBound) return;
      eventsBound = true;

      document.getElementById("tabs-bar").addEventListener("click", (e) => {
        if (e.target.closest("[data-action=add-day]")) {
          addDay();
          return;
        }
        if (e.target.closest("[data-action=export-data]")) {
          exportData();
          return;
        }
        if (e.target.closest("[data-action=import-data]")) {
          document.getElementById("import-file").click();
          return;
        }
        const tab = e.target.closest(".day-tab");
        if (tab) selectDay(tab.dataset.dayId);
      });

      document.getElementById("import-file").addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        if (file) importData(file);
        e.target.value = "";
      });

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        const picker = document.getElementById("time-picker");
        const durationPicker = document.getElementById("duration-picker");
        const editSheet = document.getElementById("edit-task-sheet");
        if (!picker.classList.contains("hidden")) closeTimePicker();
        else if (!durationPicker.classList.contains("hidden")) closeDurationPicker();
        else if (!editSheet.classList.contains("hidden")) closeEditTask();
      });

      document.getElementById("day-panels").addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el) return;

        const { action, dayId, index, view, mode, field } = el.dataset;

        if (action === "now") setActualEnd(dayId, Number(index), nowTimeString());
        if (action === "view") setView(dayId, view);
        if (action === "reset") resetDay(dayId);
        if (action === "set-mode") setMode(dayId, mode);
        if (action === "open-picker") openTimePicker(dayId, Number(index), el.dataset.current, field || "actualEnd");
        if (action === "open-duration-picker") openDurationPicker(dayId, Number(index), el.dataset.current);
        if (action === "edit-task") openEditTask(dayId, Number(index));
        if (action === "move-up") moveTask(dayId, Number(index), -1);
        if (action === "move-down") moveTask(dayId, Number(index), 1);
        if (action === "delete-task") deleteTask(dayId, Number(index));
        if (action === "add-task") addTask(dayId);
        if (action === "delete-day") deleteDay(dayId);
      });

      document.getElementById("day-panels").addEventListener("change", (e) => {
        const el = e.target.closest("[data-action=toggle]");
        if (!el) return;
        toggleItem(el.dataset.dayId, Number(el.dataset.index), el.checked);
      });

      document.getElementById("day-panels").addEventListener("input", (e) => {
        const notesEl = e.target.closest("[data-action=notes]");
        if (notesEl) {
          clearTimeout(notesDebounce);
          notesDebounce = setTimeout(() => {
            ensureDayState(notesEl.dataset.dayId).notes = notesEl.value;
            saveState();
          }, 300);
          return;
        }

        const titleEl = e.target.closest("[data-action=day-title]");
        if (titleEl) {
          clearTimeout(titleDebounce);
          titleDebounce = setTimeout(() => {
            const day = days.find((d) => d.id === titleEl.dataset.dayId);
            if (day) {
              day.title = titleEl.value.trim() || day.tabLabel;
              saveState();
            }
          }, 300);
        }
      });
    }

    function selectDay(dayId) {
      state.activeDayId = dayId;
      saveState();
      renderApp();
    }

    function setView(dayId, view) {
      ensureDayState(dayId).activeView = view;
      saveState();
      renderApp();
    }

    function toggleItem(dayId, index, checked) {
      const day = days.find((d) => d.id === dayId);
      const dayState = ensureDayState(dayId);
      const schedule = computeSchedule(day.items, dayState);
      const key = String(index);

      if (!canToggleCheck(dayState, day.items.length, index, checked)) {
        showToast(checked
          ? "Önce sıradaki durağı tamamlayın"
          : "Yalnızca en son tamamlanan durağı geri alabilirsiniz");
        renderApp();
        return;
      }

      if (checked) {
        dayState.items[key] = {
          done: true,
          actualEnd: snapToHalfHour(dayState.items[key]?.actualEnd || defaultActualEnd(day, index, schedule))
        };
      } else {
        delete dayState.items[key];
      }

      saveState();
      renderApp();
    }

    function setActualEnd(dayId, index, time) {
      if (!time) return;
      const dayState = ensureDayState(dayId);
      const key = String(index);
      dayState.items[key] = { done: true, actualEnd: snapToHalfHour(time) };
      saveState();
      renderApp();
    }

    function resetDay(dayId) {
      const day = days.find((d) => d.id === dayId);
      state.days[dayId] = getDefaultDayState(day);
      saveState();
      renderApp();
    }

    initTimePicker();
    renderApp();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
