<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gezi Rota</title>
  <style>
    :root {
      --bg: linear-gradient(160deg, #fff5e6 0%, #e8f7ff 50%, #fff0f5 100%);
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #ffffff;
      --accent: #ff6b35;
      --accent-2: #00b4d8;
      --sun: #ffd166;
      --text: #2d3436;
      --text-muted: #636e72;
      --success: #2ecc71;
      --delay: #e17055;
      --border: rgba(255, 107, 53, 0.15);
      --shadow: 0 4px 24px rgba(255, 107, 53, 0.1);
      --radius: 16px;
      --radius-pill: 999px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 0.75rem 1rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      max-width: 720px;
      margin: 0 auto;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .day-tab {
      flex-shrink: 0;
      background: transparent;
      border: 2px solid transparent;
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.5rem 1.1rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .day-tab:hover {
      background: rgba(255, 107, 53, 0.08);
      color: var(--accent);
    }

    .day-tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px rgba(255, 107, 53, 0.35);
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }

    .day-panel { display: none; }
    .day-panel.active { display: block; }

    .day-card {
      background: var(--surface);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .day-header {
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.12), rgba(0, 180, 216, 0.12));
      padding: 1.25rem 1.25rem 1rem;
    }

    .day-title-row {
      align-items: flex-start;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .day-title {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .delay-summary {
      background: rgba(225, 112, 85, 0.15);
      border-radius: var(--radius-pill);
      color: var(--delay);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      white-space: nowrap;
    }

    .delay-summary.on-time {
      background: rgba(46, 204, 113, 0.15);
      color: var(--success);
    }

    .delay-summary.ahead {
      background: rgba(46, 204, 113, 0.15);
      color: var(--success);
    }

    .progress-wrap { margin-top: 0.25rem; }

    .progress-label {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    .progress-bar {
      background: rgba(0, 0, 0, 0.06);
      border-radius: var(--radius-pill);
      height: 8px;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, var(--accent), var(--sun));
      border-radius: var(--radius-pill);
      height: 100%;
      transition: width 0.35s ease;
    }

    .sub-bar-wrap {
      display: flex;
      justify-content: center;
      padding: 1rem 1rem 0;
    }

    .sub-bar {
      background: rgba(0, 0, 0, 0.04);
      border-radius: var(--radius-pill);
      display: inline-flex;
      gap: 0.25rem;
      padding: 0.25rem;
    }

    .sub-tab {
      background: transparent;
      border: none;
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.45rem 1.25rem;
      transition: all 0.2s;
    }

    .sub-tab:hover { color: var(--accent-2); }

    .sub-tab.active {
      background: var(--surface-solid);
      box-shadow: 0 2px 8px rgba(0, 180, 216, 0.2);
      color: var(--accent-2);
    }

    .day-body { padding: 1rem 1.25rem 1.25rem; }

    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .day-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.75rem;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid rgba(225, 112, 85, 0.4);
      border-radius: var(--radius-pill);
      color: var(--delay);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: rgba(225, 112, 85, 0.1);
    }

    .itinerary-header {
      color: var(--text-muted);
      display: grid;
      font-size: 0.7rem;
      font-weight: 600;
      gap: 0.4rem;
      grid-template-columns: 32px 72px 72px 1fr 64px;
      letter-spacing: 0.04em;
      padding: 0 0.75rem 0.5rem;
      text-transform: uppercase;
    }

    .task-row {
      align-items: start;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: grid;
      gap: 0.4rem 0.6rem;
      grid-template-columns: 32px 72px 72px 1fr 64px;
      margin-bottom: 0.6rem;
      padding: 0.85rem 0.75rem;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .task-row.next-up {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.15);
    }

    .task-row.done {
      border-color: rgba(46, 204, 113, 0.35);
      opacity: 0.88;
    }

    .task-check {
      accent-color: var(--success);
      cursor: pointer;
      height: 18px;
      margin-top: 2px;
      width: 18px;
    }

    .time-col { font-variant-numeric: tabular-nums; }

    .time-planned {
      color: var(--text-muted);
      display: block;
      font-size: 0.72rem;
      text-decoration: line-through;
    }

    .time-planned.hidden { display: none; }

    .time-adjusted {
      color: var(--text);
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .time-adjusted.late { color: var(--delay); }
    .time-adjusted.early { color: var(--success); }

    .delta-badge {
      border-radius: 6px;
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      margin-top: 0.15rem;
      padding: 0.08rem 0.3rem;
    }

    .delta-badge.late {
      background: rgba(225, 112, 85, 0.15);
      color: var(--delay);
    }

    .delta-badge.early {
      background: rgba(46, 204, 113, 0.15);
      color: var(--success);
    }

    .col-stop {
      font-size: 0.92rem;
      min-width: 0;
    }

    .col-stop a {
      color: var(--accent-2);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
    }

    .task-controls {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-top: 0.25rem;
    }

    .task-controls.hidden { display: none; }

    .time-input {
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
    }

    .btn-now {
      background: var(--accent-2);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      transition: opacity 0.2s;
    }

    .btn-now:hover { opacity: 0.85; }

    .col-duration {
      color: var(--text-muted);
      font-size: 0.82rem;
      text-align: right;
    }

    .notes-area {
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.6;
      min-height: 220px;
      padding: 1rem;
      resize: vertical;
      width: 100%;
    }

    .notes-area:focus {
      border-color: var(--accent-2);
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.15);
    }

    @media (max-width: 600px) {
      .itinerary-header { display: none; }

      .task-row {
        grid-template-columns: 28px 1fr 1fr;
      }

      .col-start { grid-column: 2; }
      .col-end { grid-column: 3; }

      .col-stop {
        grid-column: 2 / -1;
        margin-top: 0.15rem;
      }

      .col-duration {
        grid-column: 2 / -1;
        text-align: left;
      }

      .col-duration:not(:empty)::before {
        color: var(--text-muted);
        content: "Süre: ";
      }

      .col-start::before {
        color: var(--text-muted);
        content: "Başlangıç";
        display: block;
        font-size: 0.68rem;
        font-weight: 600;
        margin-bottom: 0.1rem;
        text-transform: uppercase;
      }

      .col-end::before {
        color: var(--text-muted);
        content: "Bitiş";
        display: block;
        font-size: 0.68rem;
        font-weight: 600;
        margin-bottom: 0.1rem;
        text-transform: uppercase;
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="tabs" id="tabs" role="tablist" aria-label="Günler"></div>
  </header>
  <main id="day-panels"></main>

  <script>
    const STORAGE_KEY = "geziRota_v1";

    const days = [
      {
        id: "day1",
        tabLabel: "1. Gün",
        title: "5 Temmuz Pazar – İstanbul ➔ Cunda",
        notes: "",
        items: [
          { time: "05:00", stop: "İstanbul'dan çıkış", duration: "" },
          { time: "09:30", stop: "Kahvaltı (Ayvalık / Küçükköy civarı)", duration: "45-60 dk" },
          { time: "10:30", stop: "Küçükköy (taş sokaklar, sanat atölyeleri)", duration: "45-60 dk" },
          { time: "11:30", stop: "Şeytan Sofrası", duration: "30-40 dk" },
          { time: "12:15", stop: "🏖️ Sarımsaklı Halk Plajı (ücretsiz giriş, kum plaj, denize girme)", duration: "1-1,5 saat" },
          { time: "13:50", stop: "Airbnb'ye hareket", duration: "" },
          { time: "14:00", stop: "Airbnb Check-in", duration: "30 dk" },
          { time: "15:00", stop: "Rahmi M. Koç Müzesi", duration: "45 dk" },
          { time: "15:50", stop: "Sevim ve Necdet Kent Kitaplığı", duration: "20 dk" },
          { time: "16:20", stop: "Cunda taş sokakları + meşhur börekçi", duration: "1 saat" },
          { time: "17:30", stop: "Cunda sahili ve marina yürüyüşü", duration: "30 dk" },
          { time: "18:00", stop: "Aşıklar Tepesi (gün batımı)", duration: "45-60 dk" },
          { time: "19:15", stop: "Tekne turu (varsa)", duration: "60 dk" },
          { time: "20:30", stop: "Deniz kenarında akşam yemeği", duration: "" },
          { time: "22:00", stop: "Cunda merkezde serbest zaman ve Airbnb'ye dönüş", duration: "" }
        ]
      }
    ];

    let state = loadState();
    let notesDebounce = null;

    function timeToMinutes(time) {
      const [h, m] = time.split(":").map(Number);
      return h * 60 + m;
    }

    function minutesToTime(mins) {
      const wrapped = ((mins % 1440) + 1440) % 1440;
      const h = Math.floor(wrapped / 60);
      const m = wrapped % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function parseDuration(str) {
      if (!str || !str.trim()) return 0;
      const s = str.toLowerCase().trim().replace(",", ".");

      const hourRange = s.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\s*saat/);
      if (hourRange) {
        const avg = (parseFloat(hourRange[1]) + parseFloat(hourRange[2])) / 2;
        return Math.round(avg * 60);
      }

      const dkRange = s.match(/(\d+)\s*-\s*(\d+)\s*dk/);
      if (dkRange) {
        return Math.round((parseInt(dkRange[1], 10) + parseInt(dkRange[2], 10)) / 2);
      }

      const hour = s.match(/(\d+(?:\.\d+)?)\s*saat/);
      if (hour) return Math.round(parseFloat(hour[1]) * 60);

      const dk = s.match(/(\d+)\s*dk/);
      if (dk) return parseInt(dk[1], 10);

      return 0;
    }

    function formatDelta(mins) {
      if (mins === 0) return { text: "", type: "" };
      const abs = Math.abs(mins);
      let text;
      if (abs < 60) {
        text = `${mins > 0 ? "+" : "-"}${abs} dk`;
      } else {
        const h = Math.floor(abs / 60);
        const m = abs % 60;
        const sign = mins > 0 ? "+" : "-";
        text = m ? `${sign}${h}s ${m}dk` : `${sign}${h} saat`;
      }
      return { text, type: mins > 0 ? "late" : "early" };
    }

    function formatDelaySummary(mins) {
      if (mins === 0) return "Zamanında";
      const { text } = formatDelta(mins);
      return mins > 0 ? text : text;
    }

    function getDefaultDayState(day) {
      return {
        activeView: "program",
        notes: day.notes || "",
        items: {}
      };
    }

    function loadState() {
      const defaults = {
        activeDayId: days[0]?.id || null,
        days: {}
      };
      days.forEach((day) => {
        defaults.days[day.id] = getDefaultDayState(day);
      });

      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return defaults;

        if (saved.activeDayId && days.some((d) => d.id === saved.activeDayId)) {
          defaults.activeDayId = saved.activeDayId;
        }

        days.forEach((day) => {
          const savedDay = saved.days?.[day.id];
          if (!savedDay) return;
          defaults.days[day.id] = {
            activeView: savedDay.activeView === "notes" ? "notes" : "program",
            notes: typeof savedDay.notes === "string" ? savedDay.notes : day.notes || "",
            items: savedDay.items && typeof savedDay.items === "object" ? savedDay.items : {}
          };
        });
      } catch (_) {
        /* ignore corrupt storage */
      }

      return defaults;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function ensureDayState(dayId) {
      if (!state.days[dayId]) {
        const day = days.find((d) => d.id === dayId);
        state.days[dayId] = getDefaultDayState(day || { notes: "" });
      }
      return state.days[dayId];
    }

    function getPlannedSlotDuration(dayItems, index) {
      const durationMin = parseDuration(dayItems[index].duration);
      if (durationMin > 0) return durationMin;
      if (index < dayItems.length - 1) {
        return timeToMinutes(dayItems[index + 1].time) - timeToMinutes(dayItems[index].time);
      }
      return 0;
    }

    function computeSchedule(dayItems, dayState) {
      const n = dayItems.length;
      const schedule = [];

      for (let i = 0; i < n; i++) {
        const item = dayItems[i];
        const plannedStartMin = timeToMinutes(item.time);
        const slotDuration = getPlannedSlotDuration(dayItems, i);
        const plannedEndMin = plannedStartMin + slotDuration;
        const itemState = dayState.items[String(i)];
        const isDone = Boolean(itemState?.done && itemState?.actualEnd);

        let adjustedStartMin;
        if (i === 0) {
          adjustedStartMin = plannedStartMin;
        } else {
          const prev = schedule[i - 1];
          adjustedStartMin = prev.isDone
            ? timeToMinutes(prev.actualEnd)
            : timeToMinutes(prev.adjustedEnd);
        }

        let adjustedEndMin;
        if (isDone) {
          adjustedEndMin = timeToMinutes(itemState.actualEnd);
        } else {
          adjustedEndMin = adjustedStartMin + slotDuration;
        }

        schedule.push({
          index: i,
          plannedStart: item.time,
          plannedEnd: minutesToTime(plannedEndMin),
          adjustedStart: minutesToTime(adjustedStartMin),
          adjustedEnd: minutesToTime(adjustedEndMin),
          actualEnd: isDone ? itemState.actualEnd : null,
          slotDuration,
          isDone,
          startDeltaMin: adjustedStartMin - plannedStartMin,
          endDeltaMin: adjustedEndMin - plannedEndMin
        });
      }

      return schedule;
    }

    function getDayProgress(day, dayState) {
      const total = day.items.length;
      const done = Object.values(dayState.items).filter((i) => i.done).length;
      return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
    }

    function getDayDelay(schedule) {
      const nextIdx = schedule.findIndex((s) => !s.isDone);
      if (nextIdx === -1) {
        const last = schedule[schedule.length - 1];
        return last ? last.endDeltaMin : 0;
      }
      return schedule[nextIdx].startDeltaMin;
    }

    function getNextUpIndex(dayState, itemCount) {
      for (let i = 0; i < itemCount; i++) {
        const item = dayState.items[String(i)];
        if (!item?.done) return i;
      }
      return -1;
    }

    function nowTimeString() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    function renderStop(item) {
      if (item.link) {
        return `<a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.stop}</a>`;
      }
      return item.stop;
    }

    function defaultActualEnd(day, index, schedule) {
      return schedule[index].adjustedEnd;
    }

    function renderTimeCell(planned, adjusted, deltaMin) {
      const showPlanned = deltaMin !== 0;
      const delta = formatDelta(deltaMin);
      const tone = deltaMin > 0 ? "late" : deltaMin < 0 ? "early" : "";
      return `
        <span class="time-planned${showPlanned ? "" : " hidden"}">${planned}</span>
        <span class="time-adjusted${tone ? ` ${tone}` : ""}">${adjusted}</span>
        ${delta.text ? `<span class="delta-badge ${delta.type}">${delta.text}</span>` : ""}
      `;
    }

    function renderTaskRow(day, dayState, schedule, index) {
      const item = day.items[index];
      const slot = schedule[index];
      const itemState = dayState.items[String(index)] || {};
      const isDone = Boolean(itemState.done);
      const isNext = getNextUpIndex(dayState, day.items.length) === index;
      const displayEnd = isDone ? (itemState.actualEnd || slot.adjustedEnd) : slot.adjustedEnd;

      return `
        <div class="task-row${isDone ? " done" : ""}${isNext ? " next-up" : ""}" data-index="${index}">
          <input
            type="checkbox"
            class="task-check"
            aria-label="${item.stop} tamamlandı"
            ${isDone ? "checked" : ""}
            data-action="toggle"
            data-day-id="${day.id}"
            data-index="${index}"
          />
          <div class="time-col col-start">
            ${renderTimeCell(slot.plannedStart, slot.adjustedStart, slot.startDeltaMin)}
          </div>
          <div class="time-col col-end">
            ${isDone
              ? renderTimeCell(slot.plannedEnd, displayEnd, slot.endDeltaMin)
              : `<span class="time-planned${slot.endDeltaMin !== 0 ? "" : " hidden"}">${slot.plannedEnd}</span>
                 <span class="time-adjusted${slot.endDeltaMin > 0 ? " late" : slot.endDeltaMin < 0 ? " early" : ""}">${displayEnd}</span>`}
            <div class="task-controls${isDone ? "" : " hidden"}">
              <input
                type="time"
                class="time-input"
                value="${itemState.actualEnd || slot.adjustedEnd}"
                aria-label="Bitiş saati"
                data-action="set-end"
                data-day-id="${day.id}"
                data-index="${index}"
              />
              <button type="button" class="btn-now" data-action="now" data-day-id="${day.id}" data-index="${index}">Şimdi</button>
            </div>
          </div>
          <div class="col-stop">${renderStop(item)}</div>
          <div class="col-duration">${item.duration || ""}</div>
        </div>
      `;
    }

    function renderDayPanel(day) {
      const dayState = ensureDayState(day.id);
      const schedule = computeSchedule(day.items, dayState);
      const progress = getDayProgress(day, dayState);
      const delayMin = getDayDelay(schedule);
      const delayLabel = formatDelaySummary(delayMin);
      const delayClass = delayMin > 0 ? "" : delayMin < 0 ? " ahead" : " on-time";
      const isActive = state.activeDayId === day.id;

      return `
        <section
          class="day-panel${isActive ? " active" : ""}"
          id="panel-${day.id}"
          role="tabpanel"
          aria-labelledby="tab-${day.id}"
          ${isActive ? "" : "hidden"}
        >
          <div class="day-card">
            <div class="day-header">
              <div class="day-title-row">
                <h2 class="day-title">📅 ${day.title}</h2>
                <span class="delay-summary${delayClass}">${delayLabel}</span>
              </div>
              <div class="progress-wrap">
                <div class="progress-label">${progress.done} / ${progress.total} tamamlandı</div>
                <div class="progress-bar" role="progressbar" aria-valuenow="${progress.pct}" aria-valuemin="0" aria-valuemax="100">
                  <div class="progress-fill" style="width:${progress.pct}%"></div>
                </div>
              </div>
            </div>

            <div class="sub-bar-wrap">
              <div class="sub-bar" role="tablist" aria-label="${day.tabLabel} görünümü">
                <button
                  type="button"
                  class="sub-tab${dayState.activeView === "program" ? " active" : ""}"
                  role="tab"
                  aria-selected="${dayState.activeView === "program"}"
                  data-action="view"
                  data-day-id="${day.id}"
                  data-view="program"
                >Program</button>
                <button
                  type="button"
                  class="sub-tab${dayState.activeView === "notes" ? " active" : ""}"
                  role="tab"
                  aria-selected="${dayState.activeView === "notes"}"
                  data-action="view"
                  data-day-id="${day.id}"
                  data-view="notes"
                >Notlar</button>
              </div>
            </div>

            <div class="day-body">
              <div class="view-panel${dayState.activeView === "program" ? " active" : ""}" data-view-panel="program">
                <div class="day-actions">
                  <button type="button" class="btn-reset" data-action="reset" data-day-id="${day.id}">Günü sıfırla</button>
                </div>
                <div class="itinerary-header">
                  <span></span>
                  <span>Başlangıç</span>
                  <span>Bitiş</span>
                  <span>Durak</span>
                  <span>Süre</span>
                </div>
                ${day.items.map((_, i) => renderTaskRow(day, dayState, schedule, i)).join("")}
              </div>
              <div class="view-panel${dayState.activeView === "notes" ? " active" : ""}" data-view-panel="notes">
                <textarea
                  class="notes-area"
                  placeholder="Bu gün için notlar, adresler, rezervasyon bilgileri..."
                  data-action="notes"
                  data-day-id="${day.id}"
                >${escapeHtml(dayState.notes)}</textarea>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderTab(day, index) {
      const isActive = state.activeDayId === day.id;
      return `
        <button
          type="button"
          class="day-tab${isActive ? " active" : ""}"
          id="tab-${day.id}"
          role="tab"
          aria-controls="panel-${day.id}"
          aria-selected="${isActive}"
          data-day-id="${day.id}"
          tabindex="${isActive ? "0" : "-1"}"
        >${day.tabLabel}</button>
      `;
    }

    function renderApp() {
      document.getElementById("tabs").innerHTML = days.map(renderTab).join("");
      document.getElementById("day-panels").innerHTML = days.map(renderDayPanel).join("");
      bindEvents();
    }

    function bindEvents() {
      document.getElementById("tabs").querySelectorAll(".day-tab").forEach((tab) => {
        tab.addEventListener("click", () => selectDay(tab.dataset.dayId));
      });

      document.getElementById("day-panels").addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el) return;

        const { action, dayId, index, view } = el.dataset;

        if (action === "toggle") toggleItem(dayId, Number(index), el.checked);
        if (action === "now") setActualEnd(dayId, Number(index), nowTimeString());
        if (action === "view") setView(dayId, view);
        if (action === "reset") resetDay(dayId);
      });

      document.getElementById("day-panels").addEventListener("change", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el) return;
        if (el.dataset.action === "set-end") {
          setActualEnd(el.dataset.dayId, Number(el.dataset.index), el.value);
        }
      });

      document.getElementById("day-panels").addEventListener("input", (e) => {
        const el = e.target.closest("[data-action=notes]");
        if (!el) return;
        clearTimeout(notesDebounce);
        notesDebounce = setTimeout(() => {
          ensureDayState(el.dataset.dayId).notes = el.value;
          saveState();
        }, 300);
      });
    }

    function selectDay(dayId) {
      state.activeDayId = dayId;
      saveState();
      renderApp();
    }

    function setView(dayId, view) {
      ensureDayState(dayId).activeView = view;
      saveState();
      renderApp();
    }

    function toggleItem(dayId, index, checked) {
      const day = days.find((d) => d.id === dayId);
      const dayState = ensureDayState(dayId);
      const schedule = computeSchedule(day.items, dayState);
      const key = String(index);

      if (checked) {
        dayState.items[key] = {
          done: true,
          actualEnd: dayState.items[key]?.actualEnd || defaultActualEnd(day, index, schedule)
        };
      } else {
        delete dayState.items[key];
        const keys = Object.keys(dayState.items).map(Number).sort((a, b) => a - b);
        for (const k of keys) {
          if (k > index) delete dayState.items[String(k)];
        }
      }

      saveState();
      renderApp();
    }

    function setActualEnd(dayId, index, time) {
      if (!time) return;
      const dayState = ensureDayState(dayId);
      const key = String(index);
      dayState.items[key] = { done: true, actualEnd: time };
      saveState();
      renderApp();
    }

    function resetDay(dayId) {
      if (!confirm("Bu günün tüm ilerlemesi silinsin mi?")) return;
      const day = days.find((d) => d.id === dayId);
      state.days[dayId] = getDefaultDayState(day);
      saveState();
      renderApp();
    }

    renderApp();
  </script>
</body>
</html>
